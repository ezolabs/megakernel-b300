  <text x="0" y="560" font-family="Inter, system-ui, sans-serif" font-size="14" fill="currentColor">Steps on different benches do not compare as numbers: read each step's own before → after.</text>
  <text x="0" y="580" font-family="Inter, system-ui, sans-serif" font-size="14" fill="currentColor">The megakernel build averages 870 over 14 boots; 5 of their 208 bench requests passed 1,000.</text>
