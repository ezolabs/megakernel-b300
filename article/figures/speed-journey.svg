<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 618" width="720" height="618" role="img" aria-labelledby="title desc">
  <title id="title">One user's decode speed on 4×B300, step by step from first boot</title>
  <desc id="desc">Column chart drawn to scale from zero of one user's decode speed, in tokens per second for one stream, on 4×B300 nodes, step by step from 26 to 31 October 2026. Each step was measured on its own bench and is labelled with its own before and after. First boot, 26 October, ramp bench: 439. Engine tuning, 27 October, an older command-line bench: 443 before, 516 after. Fast host cores, 28 to 29 October, ramp bench: 514 before, 614 to 639 after. NVIDIA's megakernel with our B300 patch, 28 to 30 October, speed gate: 638.4 before, 849.0 and 885.8 after, on two boots. The megakernel build as served, 14 boots across two code versions, 30 to 31 October, decode test: boot averages 840.9 to 906.7, average 870.2, about twice the first boot. A dashed line marks 1,000 tokens per second. Above it sits one marker: the fastest of 208 bench requests, 1,063.8. Last, live production traffic on node 2 over 34.5 minutes on 30 October: 873.4 tokens per second from the engine's mean gap between tokens, beside the bench average; the busier node 1 averaged 702.2. Steps on different benches do not compare as numbers.</desc>
  <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="-0.01em" fill="currentColor">One user's decode speed roughly doubled in five days</text>
  <text x="0" y="46" font-family="Inter, system-ui, sans-serif" font-size="14" fill="currentColor" fill-opacity="0.62">Tokens per second for one stream on 4×B300, 26–31 October 2026. Each step on its own bench</text>
