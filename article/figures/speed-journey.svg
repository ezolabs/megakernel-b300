  <rect x="420.75" y="66.75" width="10.5" height="10.5" rx="1.25" fill="#3b6ef6" fill-opacity="0.16" stroke="#3b6ef6" stroke-width="1.5"/>
  <text x="438" y="77" font-family="Inter, system-ui, sans-serif" font-size="14" fill="currentColor">Live traffic</text>
