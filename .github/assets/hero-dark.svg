  <text x="190" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle" fill="#a3a6b0">0%</text>
  <text x="495.9090909090909" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle" fill="#a3a6b0">10%</text>
  <text x="801.8181818181818" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle" fill="#a3a6b0">20%</text>
  <text x="1107.7272727272727" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle" fill="#a3a6b0">30%</text>
  <text x="1413.6363636363635" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle" fill="#a3a6b0">40%</text>
  <text x="170" y="176" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" text-anchor="end" fill="#e6e8ee">1 stream</text>
