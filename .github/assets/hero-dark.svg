  <text x="64" y="518" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a3a6b0">At one stream: 638.4 tok/s without the megakernel, 885.8 and 849.0 with it, on two boots.</text>
