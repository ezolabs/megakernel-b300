<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Per-stream decode gain from NVIDIA's megakernel on a 4x B300 node, by streams at once</title>
  <desc id="desc">Bar chart drawn to scale from zero of the gain in per-stream decode speed from NVIDIA's megakernel over our tuned stack without it, one 4x B300 node, by streams decoding at once, for two boots of the same build. 1 stream: plus 38.8% on the first boot and plus 33.0% on the second; 2 streams: plus 29.6% on the first boot and plus 29.8% on the second; 4 streams: plus 23.7% on the first boot and plus 23.9% on the second; 8 streams: plus 11.7% on the first boot and plus 14.7% on the second; 16 streams: plus 1.1% on the first boot and plus 0.7% on the second. At one stream that is 638.4 tokens per second without the megakernel, 885.8 and 849.0 with it. Baseline values by streams: 638.4, 530.6, 450, 350.9, 294.6 tokens per second. Bars for the second boot are lighter. Data: article/figures/lead.csv.</desc>
  <rect width="1600" height="560" fill="#0d0d0d"/>
  <text x="64" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8" font-feature-settings="'ss01' 1" fill="#e6e8ee">Up to 38.8% faster per stream on the megakernel</text>
  <text x="64" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a3a6b0">Per-stream decode gain over our tuned stack without it, one 4x B300 node, by streams decoding at once</text>
